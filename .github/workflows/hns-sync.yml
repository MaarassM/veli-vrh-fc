name: HNS sync trigger

# Vercel Hobby cron je ograničen na 1×/dan, pa češće osvježavanje radimo odavde.
on:
  schedule:
    # Radnim danom: ~10:00 i ~20:00 po hrvatskom vremenu (8 i 18 UTC)
    - cron: '0 8,18 * * 1-5'
    # Vikendom: svaki sat 13–21 UTC (≈ 15–23 po HR ljeti) — rezultati stižu tijekom dana
    - cron: '0 13-21 * * 6,0'
  workflow_dispatch:

jobs:
  trigger-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync endpoint
        run: |
          curl -fsS --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.SYNC_URL || 'https://veli-vrh-fc.vercel.app/api/cron/sync' }}"
